<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Simarpreet Singh — AI Agent Engineer, idea to production">
  <defs>
    <linearGradient id="holo" x1="0" x2="1">
      <stop offset="0" stop-color="#ff9de2"/><stop offset=".25" stop-color="#b8a6ff"/><stop offset=".5" stop-color="#7fe7ff"/>
      <stop offset=".75" stop-color="#c6ffdd"/><stop offset="1" stop-color="#ffe29f"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#dfe6f5"/><stop offset=".5" stop-color="#8b93b8"/>
      <stop offset=".62" stop-color="#f1f4ff"/><stop offset="1" stop-color="#b9c0dc"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="r"><rect width="1200" height="300" rx="26"/></clipPath>
    <symbol id="spark" viewBox="0 0 100 100"><polygon points="50,0 61,39 100,50 61,61 50,100 39,61 0,50 39,39" fill="url(#chrome)"/></symbol>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="#07051a"/>
    <circle cx="140" cy="40" r="150" fill="#7b5cff" opacity=".6" filter="url(#blur)"/>
    <circle cx="1080" cy="230" r="170" fill="#ff5fc8" opacity=".5" filter="url(#blur)"/>
    <circle cx="640" cy="320" r="150" fill="#2fd8ff" opacity=".45" filter="url(#blur)"/>
    <g stroke="#7fe7ff" stroke-opacity=".08">
      <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
      <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/>
    </g>
    <!-- glass window -->
    <rect x="60" y="44" width="1080" height="212" rx="22" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".3"/>
    <rect x="60" y="44" width="1080" height="36" rx="22" fill="#ffffff" fill-opacity=".12"/>
    <circle cx="88" cy="62" r="6" fill="url(#chrome)"/><circle cx="108" cy="62" r="6" fill="url(#chrome)"/><circle cx="128" cy="62" r="6" fill="url(#chrome)"/>
    <text x="1116" y="68" text-anchor="end" font-family="Consolas,monospace" font-size="16" fill="#b9b3d9">hello_world.exe</text>
    <text x="96" y="124" font-family="Consolas,monospace" font-size="20" fill="#7fe7ff" letter-spacing="1">&gt; HI, I'M SIMARPREET_</text>
    <text x="96" y="186" font-family="Verdana,Arial Black,sans-serif" font-weight="900" font-size="54" fill="url(#chrome)" stroke="#7b5cff" stroke-opacity=".5" stroke-width="1">AI Agent Engineer</text>
    <text x="96" y="230" font-family="Verdana,sans-serif" font-weight="700" font-size="26" fill="url(#holo)">building AI products, from idea → production</text>
    <use href="#spark" x="1010" y="104" width="40" height="40"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></use>
    <use href="#spark" x="1066" y="160" width="22" height="22"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></use>
    <use href="#spark" x="960" y="190" width="16" height="16"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></use>
  </g>
</svg>
