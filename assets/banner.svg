    <ellipse cx="600" cy="-40" rx="520" ry="200" fill="#5b8cff" opacity=".22" filter="url(#blur)"/>
    <g stroke="#ffffff" stroke-opacity=".05">
      <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
      <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/>
    </g>
    <!-- glass window -->
    <rect x="60" y="44" width="1080" height="212" rx="22" fill="#16191e" fill-opacity=".7" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="60" y="44" width="1080" height="36" rx="22" fill="#ffffff" fill-opacity=".03"/>
    <circle cx="88" cy="62" r="6" fill="url(#chrome)"/><circle cx="108" cy="62" r="6" fill="url(#chrome)"/><circle cx="128" cy="62" r="6" fill="url(#chrome)"/>
    <text x="1116" y="68" text-anchor="end" font-family="Consolas,monospace" font-size="16" fill="#6b7280">simar00316.github.io</text>
    <text x="96" y="124" font-family="Consolas,monospace" font-size="20" fill="#9aa1ad" letter-spacing="2">● SIMARPREET SINGH</text>
    <text x="96" y="186" font-family="Inter,Segoe UI,Helvetica,sans-serif" font-weight="700" letter-spacing="-1.5" font-size="54" fill="url(#chrome)">AI Agent Engineer</text>
    <text x="96" y="230" font-family="Inter,Segoe UI,Helvetica,sans-serif" font-weight="500" font-size="26" fill="url(#holo)">building AI products, from idea → production</text>
